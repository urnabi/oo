name: Build APK and Push Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          mkdir -p release-apks
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apks/TheOtherSide-v1.0.0.apk
          ls -lh release-apks/TheOtherSide-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheOtherSide-v1.0.0-apk
          path: release-apks/TheOtherSide-v1.0.0.apk

      - name: Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: 'The Other Side - v1.0.0 Release (Android APK)'
          body: |
            ### The Other Side — Mindful AI Mediated Chat
            **Release v1.0.0 (Android APK Attached)**

            - 📱 **Android Native App (TheOtherSide-v1.0.0.apk)**
            - 🕊️ **Live Peer-to-Peer Chat**: Chat directly in real-time via shareable invite links
            - ⚖️ **Empathetic AI Mediator**: Real-time de-escalation & gentle tone suggestions
            - 🌿 **Pacing Mode**: 3-second breathing micro-rituals before sending
            - 📊 **Communication Insights**: 84% Calm Score and conversation health tracking
          draft: false
          prerelease: false
          files: release-apks/TheOtherSide-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
